# Jenkins Configuration as Code (JCasC) - szablon
# Wymagane wtyczki: configuration-as-code, job-dsl, nodejs, maven-plugin,
# docker-commons, workflow-aggregator, git (patrz plugins.txt w zadanie-29.md)

jenkins:
  systemMessage: "Jenkins skonfigurowany przez JCasC. Zmiany wprowadzaj w pliku YAML, nie w interfejsie."
  numExecutors: 2            # liczba wykonawców na kontrolerze
  scmCheckoutRetryCount: 2   # ponowienia pobierania z repozytorium
  quietPeriod: 5             # sekundy oczekiwania przed startem builda
  mode: NORMAL

  # Prosta lokalna baza użytkowników, hasło z zmiennej środowiskowej
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

# Globalny katalog narzędzi
tool:
  maven:
    installations:
      - name: "Maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"
  nodejs:
    installations:
      - name: "NodeJS-20"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "20.18.0"
                    npmPackagesRefreshHours: 72
  dockerTool:
    installations:
      - name: "Docker-latest"
        properties:
          - installSource:
              installers:
                - fromDocker:
                    version: "latest"

unclassified:
  location:
    url: "http://localhost:8080/"

# Przykładowe zadanie typu pipeline (wymaga wtyczki Job DSL)
jobs:
  - script: >
      pipelineJob('przykladowy-pipeline') {
        description('Przykładowe zadanie pipeline utworzone przez JCasC')
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                agent any
                options { timeout(time: 15, unit: 'MINUTES') }
                stages {
                  stage('Hello') {
                    steps {
                      echo 'Witaj z pipeline utworzonego przez JCasC!'
                    }
                  }
                }
              }
            ''')
          }
        }
      }
